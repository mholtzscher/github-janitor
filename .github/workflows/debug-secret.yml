name: Debug Secret
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check CACHIX_AUTH_TOKEN secret
        run: |
          echo "Secret is set: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}"
          echo "Secret length: ${#CACHIX_AUTH_TOKEN}"
          if [ -n "$CACHIX_AUTH_TOKEN" ]; then
            echo "First 20 chars: ${CACHIX_AUTH_TOKEN:0:20}"
            echo "Last 10 chars: ${CACHIX_AUTH_TOKEN: -10}"
          else
            echo "Secret is empty or not set"
          fi
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check PAT secret
        run: |
          echo "Secret is set: ${{ secrets.PAT != '' }}"
          echo "Secret length: ${#PAT}"
          if [ -n "$PAT" ]; then
            echo "First 20 chars: ${PAT:0:20}"
            echo "Last 10 chars: ${PAT: -10}"
          else
            echo "Secret is empty or not set"
          fi
        env:
          PAT: ${{ secrets.PAT }}
